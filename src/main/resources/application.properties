spring.application.name=b-eletricar

# Perfil padrão: banco de dados habilitado.
# Para rodar sem banco: SPRING_PROFILES_ACTIVE=nodb (application-nodb.properties)
# Para rodar via Docker: SPRING_PROFILES_ACTIVE=docker (application-docker.properties)

# Conexão com o banco (o Docker sobrescreve via SPRING_DATASOURCE_*)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beletricar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:beletricar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:beletricar}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
# spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
# spring.security.oauth2.client.registration.github.scope=read:user,user:email

# spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
# spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
# spring.security.oauth2.client.registration.facebook.scope=public_profile,email

# Ativa a criação/atualização automática das tabelas a partir do Java
spring.jpa.hibernate.ddl-auto=update

# Opcional: exibe o SQL gerado no console para você acompanhar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nome=${ADMIN_NOME:Administrador}

#upload
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB