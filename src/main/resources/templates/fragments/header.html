<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header class="site-header" th:fragment="header">
    <div class="site-header__top container">

        <a class="brand" th:href="@{/}" aria-label="Eletrocar, página inicial">
            <span class="brand__name">eletrocar</span>
        </a>
        
        <a class="site-nav__link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Administração</a>

        <a class="site-nav__link site-nav__link--accent" th:unless="${usuarioLogado}"
        th:href="@{/login}">Login</a>

        <a class="avatar avatar--sm" th:if="${usuarioLogado}" th:href="@{/perfil}"
        th:title="${usuarioLogado.nome}" aria-label="Meu perfil">
            <span class="avatar__initials"
                th:text="${#strings.isEmpty(usuarioLogado.nome) ? '?' : #strings.toUpperCase(#strings.substring(usuarioLogado.nome, 0, 1))}">?</span>
        </a>

    </div>

    <nav class="site-nav" aria-label="Principal">
        <ul class="site-nav__list container">
            <!-- Os href="#" viram thref="@{/...}" quando as páginas existirem -->
            <li><a class="site-nav__link site-nav__link--accent" th:href="@{/comparar}">Comparar veículos</a></li>
            <li><a class="site-nav__link" href="#">Renault</a></li>
            <li><a class="site-nav__link" href="#">BYD</a></li>
            <li><a class="site-nav__link" href="#">Volvo</a></li>
            <li><a class="site-nav__link" href="#">Fiat</a></li>
            <li><a class="site-nav__link" href="#">GAC</a></li>
            <li><a class="site-nav__link" href="#">BMW</a></li>
            <li><a class="site-nav__link" href="#">Audi</a></li>
            <li><a class="site-nav__link" href="#">Geely</a></li>
            <li><a class="site-nav__link" href="#">MG</a></li>
        </ul>
    </nav>
</header>

</body>
</html>
