<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="site-header" th:fragment="header">
    <div class="site-header__top container">

        <a class="brand" th:href="@{/}" aria-label="Eletrocar, página inicial">
            <span class="brand__name">eletrocar</span>
        </a>

        <form class="search" role="search"
            th:action="@{/veiculos/listagem}" method="get">

            <input class="search__input" type="search"
                name="palavraChave"
                placeholder="Buscar veículo, marca ou modelo"
                aria-label="Buscar veículo, marca ou modelo">
        </form>

        
        <a class="site-nav__link site-nav__link--accent" th:unless="${usuarioLogado}"
        th:href="@{/login}">Login</a>

        <a class="avatar avatar--sm" th:if="${usuarioLogado}" th:href="@{/perfil}"
        th:title="${usuarioLogado.nome}" aria-label="Meu perfil">
            <span class="avatar__initials"
                th:text="${#strings.isEmpty(usuarioLogado.nome) ? '?' : #strings.toUpperCase(#strings.substring(usuarioLogado.nome, 0, 1))}">?</span>
        </a>

    </div>

    <nav class="site-nav" aria-label="Principal">
        <ul class="site-nav__list container">
            <!-- Os href="#" viram th:href="@{/...}" quando as páginas existirem -->
            <li><a class="site-nav__link site-nav__link--accent" href="#">Comparar veículos</a></li>
            <li><a class="site-nav__link" href="#">Tesla</a></li>
            <li><a class="site-nav__link" href="#">BYD</a></li>
            <li><a class="site-nav__link" href="#">Polestar</a></li>
            <li><a class="site-nav__link" href="#">Rivian</a></li>
            <li><a class="site-nav__link" href="#">Lucid</a></li>
            <li><a class="site-nav__link" href="#">NIO</a></li>
            <li><a class="site-nav__link" href="#">GWM Ora</a></li>
            <li><a class="site-nav__link" href="#">Outro</a></li>
        </ul>
    </nav>
</header>

</body>
</html>
